# The Mac release: Monolist.app in a disk image, built on GitHub's own Apple
# silicon Mac and added to the release the Windows workflow publishes for the
# same tag (release-windows.yml), so the app's update check finds it there.
#
# The same tag starts both: v<version>.<build>, e.g. v0.1.170. This one waits
# for the Windows one to have published the release, then adds
# Monolist-<version>-macos-arm64.dmg, its checksum and a Mac section to the
# notes; it never makes the release itself, so the two cannot race.
#
# Signed and notarised when the repository has these five secrets, and
# exactly as before (signed ad hoc only) when it does not:
#   MONOLIST_DEVELOPER_ID_P12           the "Developer ID Application"
#                                       certificate and its key, exported
#                                       from Keychain Access as .p12, base64
#   MONOLIST_DEVELOPER_ID_P12_PASSWORD  that export's password
#   MONOLIST_NOTARY_KEY_P8              an App Store Connect team API key
#                                       (.p8), base64
#   MONOLIST_NOTARY_KEY_ID              its key ID
#   MONOLIST_NOTARY_ISSUER              its issuer ID
# Signed, the release gets both images: -macos-arm64.dmg (signed,
# notarised) and -macos-arm64-unsigned.dmg (the same build, ad hoc). The
# certificate lives in a keychain of the job's own, deleted at its end, and
# reaches no third-party action.
#
# Run by hand (Actions > macOS release > Run workflow), it builds the same
# disk image as a downloadable artifact and releases nothing.
name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      # Built in when the repository has them as secrets; without them the
      # app builds all the same and says it has no Last.fm key.
      MONOLIST_LASTFM_API_KEY: ${{ secrets.MONOLIST_LASTFM_API_KEY }}
      MONOLIST_LASTFM_SHARED_SECRET: ${{ secrets.MONOLIST_LASTFM_SHARED_SECRET }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the number of commits

      - name: The tag is this commit's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          build=$(git rev-list --count HEAD)
          version=$(sed -n 's/^project(Monolist VERSION \([0-9.]*\).*/\1/p' "Monolist Player/CMakeLists.txt")
          expected="v$version.$build"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "The tag $GITHUB_REF_NAME names another build: this commit is $expected." >&2
            exit 1
          fi

      # Homebrew's Qt, libmpv and FFmpeg, as on the owner's Mac.
      - name: Toolchain
        run: bash "Monolist Player/scripts/setup-macos.sh"

      # The secrets are read here alone, and only tested for being there:
      # "if:" may not name a secret.
      - name: Signing identity
        id: signing
        env:
          P12: ${{ secrets.MONOLIST_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MONOLIST_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MONOLIST_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MONOLIST_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MONOLIST_NOTARY_ISSUER }}
        run: |
          # None: ad hoc, as before. Some but not all: a mistake, said so,
          # rather than an unsigned release where a signed one was meant.
          missing=""
          present=0
          for pair in P12:MONOLIST_DEVELOPER_ID_P12 P12_PASSWORD:MONOLIST_DEVELOPER_ID_P12_PASSWORD \
                      NOTARY_KEY:MONOLIST_NOTARY_KEY_P8 NOTARY_KEY_ID:MONOLIST_NOTARY_KEY_ID \
                      NOTARY_ISSUER:MONOLIST_NOTARY_ISSUER; do
            variable="${pair%%:*}"
            if [ -n "${!variable}" ]; then present=$((present + 1)); else missing="$missing ${pair#*:}"; fi
          done
          if [ "$present" -eq 0 ]; then
            echo "No Developer ID secrets: the disk image is signed ad hoc, as before."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Developer ID signing is only partly set up; these secrets are missing:$missing"
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/monolist-signing.keychain-db"
          password="$(openssl rand -base64 33)"
          echo "::add-mask::$password"
          printf '%s' "$P12" | base64 --decode -o "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY" | base64 --decode -o "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$password" "$keychain"
          # Locked again after six hours, longer than the job may run.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # In front of the search list, the runner's own keychains kept.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "The certificate in MONOLIST_DEVELOPER_ID_P12 is not a usable Developer ID Application identity." >&2
            exit 1
          fi
          echo "Signing as $(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "key=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_OUTPUT"

      - name: Build, deploy, sign and the disk image
        env:
          MONOLIST_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MONOLIST_NOTARY_KEY: ${{ steps.signing.outputs.key }}
          MONOLIST_NOTARY_KEY_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.MONOLIST_NOTARY_KEY_ID || '' }}
          MONOLIST_NOTARY_ISSUER: ${{ steps.signing.outputs.enabled == 'true' && secrets.MONOLIST_NOTARY_ISSUER || '' }}
        run: bash "Monolist Player/scripts/build-macos.sh" --dmg

      # The build tree's app, which still loads Homebrew's Qt and so has its
      # offscreen platform: the tests need no screen. The disk image's is the
      # same program, deployed.
      - name: Offline self-tests of the Release build
        run: |
          exe="Monolist Player/build-macos/Monolist.app/Contents/MacOS/Monolist"
          failed=""
          for test in --account-guard-test --cookie-test --secret-test --lastfm-test --saavn-test \
                      --lyrics-query-test --format-test --sound-test --icon-test --startup-test; do
            data="$RUNNER_TEMP/${test#--}"
            mkdir -p "$data"
            set +e
            MONOLIST_DATA_DIR="$data" QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 \
                "$exe" "$test" > "$data/out.txt" 2>&1
            code=$?
            set -e
            summary=$(grep -E 'checks?, [0-9]+ failed' "$data/out.txt" | tail -n 1)
            echo "$test  exit $code  $summary"
            [ "$code" -eq 0 ] || failed="$failed $test"
          done
          if [ -n "$failed" ]; then
            echo "Self-tests failed:$failed" >&2
            exit 1
          fi

      - name: Name the disk images
        id: image
        run: |
          build=$(git rev-list --count HEAD)
          version=$(sed -n 's/^project(Monolist VERSION \([0-9.]*\).*/\1/p' "Monolist Player/CMakeLists.txt")
          dist="Monolist Player/build-macos/dist"
          name="Monolist-$version.$build-macos-arm64.dmg"
          mv "$dist/Monolist.dmg" "$dist/$name"
          (cd "$dist" && shasum -a 256 "$name" > "$name.sha256")
          unsigned=""
          if [ -f "$dist/Monolist-unsigned.dmg" ]; then
            unsigned="Monolist-$version.$build-macos-arm64-unsigned.dmg"
            mv "$dist/Monolist-unsigned.dmg" "$dist/$unsigned"
            (cd "$dist" && shasum -a 256 "$unsigned" > "$unsigned.sha256")
          fi
          echo "dir=$dist" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "unsigned=$unsigned" >> "$GITHUB_OUTPUT"
          echo "minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$dist/Monolist.app/Contents/Info.plist")" >> "$GITHUB_OUTPUT"

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: monolist-macos
          path: |
            ${{ steps.image.outputs.dir }}/*.dmg
            ${{ steps.image.outputs.dir }}/*.sha256
            Monolist Player/build-macos/notary-*.json

      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          dir="${{ steps.image.outputs.dir }}"
          name="${{ steps.image.outputs.name }}"
          unsigned="${{ steps.image.outputs.unsigned }}"
          minimum="${{ steps.image.outputs.minimum }}"
          # The Windows workflow publishes the release; up to three hours.
          for attempt in $(seq 1 180); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            [ "$attempt" -eq 180 ] && { echo "No release $GITHUB_REF_NAME was published." >&2; exit 1; }
            sleep 60
          done
          gh release upload "$GITHUB_REF_NAME" "$dir/$name" "$dir/$name.sha256" --clobber
          if [ -n "$unsigned" ]; then
            gh release upload "$GITHUB_REF_NAME" "$dir/$unsigned" "$dir/$unsigned.sha256" --clobber
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          {
            echo
            echo "**macOS** (Apple silicon, macOS $minimum or later):"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "- **$name**: open it and drag Monolist to Applications. Signed with a Developer ID and notarised by Apple: it opens like any other app."
              echo "- **$unsigned**: the same build without the Developer ID signature, for those who would rather have it so: the first time, macOS will not open it until you allow it in System Settings > Privacy & Security."
            else
              echo "- **$name**: open it and drag Monolist to Applications."
              echo
              echo 'The app is signed ad hoc, not by an Apple developer, so the first time macOS will not open it: open it once, then choose Open Anyway in System Settings > Privacy & Security.'
            fi
            echo
            echo "Everything the app needs is inside: Qt, mpv, yt-dlp, FFmpeg and Deno."
            echo
            echo "    $(cat "$dir/$name.sha256")"
            [ -z "$unsigned" ] || echo "    $(cat "$dir/$unsigned.sha256")"
          } >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

      # The certificate and the API key leave with the job, whatever happened.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
